services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paws_db
      SPRING_DATASOURCE_USERNAME: belkius
      SPRING_DATASOURCE_PASSWORD: 159753
    networks:
      - paws-network

  db:
    image: paws-backend
    environment:
      POSTGRES_DB: paws_db
      POSTGRES_USER: belkius
      POSTGRES_PASSWORD: 159753
    ports:
      - "5432:5432"
    volumes:
      - paws-db:/var/lib/postgresql/data
    networks:
      - paws-network

volumes:
  paws-db:

networks:
  paws-network: